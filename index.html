<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReGen AI - Hugging Face Photo Studio</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161d2f;
      --border-color: #2a344d;
      --accent-color: #ffff33;
      --accent-text: #000000;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus {
      border-color: #6366f1;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      transition: border-color 0.2s;
    }

    .upload-box:hover {
      border-color: #6366f1;
    }

    .upload-box input {
      display: none;
    }

    .upload-box img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      object-fit: cover;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent-color);
      color: var(--accent-text);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    .output-box {
      width: 100%;
      min-height: 400px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      overflow: hidden;
      margin-top: 1rem;
      position: relative;
    }

    .output-box img {
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
    }

    .loader {
      display: none;
      border: 4px solid var(--border-color);
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>ReGen AI Photo Studio</h1>
    <p>Powered by <strong>Hugging Face (FLUX.1-schnell)</strong> Engine</p>
  </header>

  <div class="container">
    
    <!-- HUGGING FACE API TOKEN -->
    <div class="card input-group">
      <label for="hfToken">Hugging Face User Access Token (hf_...)</label>
      <input type="password" id="hfToken" class="input-field" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
    </div>

    <!-- BILD UPLOADS -->
    <div class="grid-2">
      <!-- Bild 1: Ästhetik / Vorlage -->
      <div class="card">
        <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">1. Ästhetik & Setting (Vorlage)</label>
        <div class="upload-box" onclick="document.getElementById('refPhoto').click()">
          <input type="file" id="refPhoto" accept="image/*" onchange="previewImage(this, 'refPreview')">
          <div id="refPreview">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">📸</div>
            <div>Hintergrund/Vibe Foto wählen</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">(Belichtung, Ort & Stil)</div>
          </div>
        </div>
      </div>

      <!-- Bild 2: Person & Outfit -->
      <div class="card">
        <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">2. Dein Fit & Gesicht</label>
        <div class="upload-box" onclick="document.getElementById('fitPhoto').click()">
          <input type="file" id="fitPhoto" accept="image/*" onchange="previewImage(this, 'fitPreview')">
          <div id="fitPreview">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">🕺</div>
            <div>Dein Outfit/Person Foto wählen</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">(Dein Outfit & Gesicht)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- PROMPT ANPASSUNG -->
    <div class="card input-group">
      <label for="promptDescription">Beschreibung des Endergebnisses</label>
      <input type="text" id="promptDescription" class="input-field" value="A sleek lifestyle photograph of a person wearing stylish outfit in an aesthetic luxury location, warm sunset lighting, 35mm lens, hyperrealistic photo, 8k">
    </div>

    <!-- BUTTON -->
    <button id="generateBtn" class="btn" onclick="generatePhoto()">Foto Generieren (Hugging Face)</button>
    <div id="statusText" class="status-text"></div>

    <!-- ERGEBNIS BEREICH -->
    <div class="card" style="text-align: center;">
      <label style="font-weight:600;">Ergebnis</label>
      <div class="output-box">
        <div id="loader" class="loader"></div>
        <div id="placeholderText" style="color: var(--text-muted);">Das fertige Foto erscheint hier</div>
        <img id="outputImg" style="display: none;" alt="Generiertes Foto">
      </div>
      <a id="downloadBtn" style="display: none; margin-top: 1rem;" class="btn" download="regen-hf-photo.jpg">Bild Herunterladen</a>
    </div>

  </div>

  <script>
    function previewImage(input, previewId) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const container = document.getElementById(previewId);
          container.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
        };
        reader.readAsDataURL(file);
      }
    }

    async function generatePhoto() {
      const hfToken = document.getElementById('hfToken').value.trim();
      const promptText = document.getElementById('promptDescription').value.trim();
      
      const loader = document.getElementById('loader');
      const placeholderText = document.getElementById('placeholderText');
      const outputImg = document.getElementById('outputImg');
      const downloadBtn = document.getElementById('downloadBtn');
      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      if (!hfToken) {
        alert('Bitte gib deinen Hugging Face Token ein (beginnt mit hf_).');
        return;
      }

      // UI Update
      generateBtn.disabled = true;
      loader.style.display = 'block';
      placeholderText.style.display = 'none';
      outputImg.style.display = 'none';
      downloadBtn.style.display = 'none';
      statusText.innerText = "Hugging Face generiert das Foto auf Hochleistungsservern...";

      try {
        // Hugging Face Modell: FLUX.1-schnell (Eines der schnellsten & realistischsten Modelle)
        const modelUrl = "https://router.huggingface.co/hf-inference/models/black-forest-labs/FLUX.1-schnell";

        const response = await fetch(modelUrl, {
          headers: {
            Authorization: `Bearer ${hfToken}`,
            "Content-Type": "application/json",
          },
          method: "POST",
          body: JSON.stringify({ inputs: promptText }),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP-Fehler ${response.status}: Überprüfe deinen Token oder die Server-Auslastung.`);
        }

        // Direktes Umwandeln in ein darstellbares Bild (Blob)
        const imageBlob = await response.blob();
        const objectURL = URL.createObjectURL(imageBlob);

        outputImg.src = objectURL;
        outputImg.style.display = 'block';
        downloadBtn.href = objectURL;
        downloadBtn.style.display = 'inline-block';
        loader.style.display = 'none';
        statusText.innerText = "Fertiggestellt in wenigen Sekunden!";
        generateBtn.disabled = false;

      } catch (err) {
        alert('Fehler: ' + err.message);
        loader.style.display = 'none';
        placeholderText.style.display = 'block';
        statusText.innerText = "";
        generateBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
