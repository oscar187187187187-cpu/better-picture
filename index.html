<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReGen AI - Dating & Fit Studio (Powered by Groq & FLUX)</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #7c3aed;
      --accent-hover: #6d28d9;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-color);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      transition: border-color 0.2s;
    }

    .upload-box:hover {
      border-color: var(--accent-color);
    }

    .upload-box input {
      display: none;
    }

    .upload-box img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      object-fit: cover;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }

    .output-box {
      width: 100%;
      min-height: 380px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      overflow: hidden;
      margin-top: 1rem;
      position: relative;
    }

    .output-box img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    .loader {
      display: none;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-color);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>ReGen AI Photo Studio</h1>
    <p>Analyse via <strong>Groq API (mit Q)</strong> & Fotorealisches Rendering</p>
  </header>

  <div class="container">
    
    <!-- GROQ API KEY -->
    <div class="card input-group">
      <label for="apiKey">Groq API Key (beginnt mit gsk_)</label>
      <input type="password" id="apiKey" class="input-field" placeholder="gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
    </div>

    <!-- BILD UPLOADS -->
    <div class="grid-2">
      <!-- Bild 1: Ästhetik / Vorlage -->
      <div class="card">
        <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">1. Ästhetik & Pose (Vorlage)</label>
        <div class="upload-box" onclick="document.getElementById('refPhoto').click()">
          <input type="file" id="refPhoto" accept="image/*" onchange="previewImage(this, 'refPreview')">
          <div id="refPreview">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">📸</div>
            <div>Ästhetik-Foto wählen</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">(Hintergrund, Licht & Vibe)</div>
          </div>
        </div>
      </div>

      <!-- Bild 2: Dein Fit / Person -->
      <div class="card">
        <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">2. Dein Fit & Gesicht</label>
        <div class="upload-box" onclick="document.getElementById('fitPhoto').click()">
          <input type="file" id="fitPhoto" accept="image/*" onchange="previewImage(this, 'fitPreview')">
          <div id="fitPreview">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">🕺</div>
            <div>Dein Foto wählen</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">(Dein Gesicht & Outfit)</div>
          </div>
        </div>
      </div>
    </div>

    <!-- STYLING / EXTRA WÜNSCHE -->
    <div class="card input-group">
      <label for="extraPrompt">Zusatz-Details (Optional)</label>
      <input type="text" id="extraPrompt" class="input-field" placeholder="z. B. warmes Abendlicht, cinematic lighting, 8k photo, sharp focus">
    </div>

    <!-- GENERATION BUTTON -->
    <button id="generateBtn" class="btn" onclick="generatePhoto()">ReGen Foto Erstellen</button>
    <div id="statusText" class="status-text"></div>

    <!-- ERGEBNIS BEREICH -->
    <div class="card" style="text-align: center;">
      <label style="font-weight:600;">Ergebnis</label>
      <div class="output-box">
        <div id="loader" class="loader"></div>
        <div id="placeholderText" style="color: var(--text-muted);">Dein generiertes Foto wird hier angezeigt</div>
        <img id="outputImg" style="display: none;" alt="Generiertes Foto">
      </div>
      <a id="downloadBtn" style="display: none; margin-top: 1rem;" class="btn" download="regen-groq-photo.jpg">Bild Herunterladen</a>
    </div>

  </div>

  <script>
    let refBase64 = null;
    let fitBase64 = null;

    // Vorschau-Funktion und Konvertierung
    function previewImage(input, previewId) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const container = document.getElementById(previewId);
          container.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
          if (previewId === 'refPreview') refBase64 = e.target.result;
          if (previewId === 'fitPreview') fitBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // Hauptfunktion
    async function generatePhoto() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const extraPrompt = document.getElementById('extraPrompt').value.trim();
      const loader = document.getElementById('loader');
      const placeholderText = document.getElementById('placeholderText');
      const outputImg = document.getElementById('outputImg');
      const downloadBtn = document.getElementById('downloadBtn');
      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      if (!apiKey) {
        alert('Bitte gib deinen Groq API Key ein (beginnt mit gsk_).');
        return;
      }

      if (!refBase64 || !fitBase64) {
        alert('Bitte lade beide Fotos hoch.');
        return;
      }

      // UI Update
      generateBtn.disabled = true;
      loader.style.display = 'block';
      placeholderText.style.display = 'none';
      outputImg.style.display = 'none';
      downloadBtn.style.display = 'none';
      statusText.innerText = "Schritt 1/2: Groq Vision AI (mit Q) analysiert deine Bilder...";

      try {
        // Aktuelles Groq Multimodal Vision Modell
        const groqModel = "qwen/qwen3.8-27b"; 

        const promptInstruction = "Analyze Image 1 (background/aesthetic/lighting) and Image 2 (person/face/outfit). Create a single, extremely detailed, highly photorealistic prompt describing the person from Image 2 seamlessly integrated into the environment and aesthetic of Image 1. Output ONLY the English prompt, no introduction, max 100 words.";

        // Groq API Call
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: groqModel,
            messages: [
              {
                role: "user",
                content: [
                  { type: "text", text: promptInstruction },
                  { type: "image_url", image_url: { url: refBase64 } },
                  { type: "image_url", image_url: { url: fitBase64 } }
                ]
              }
            ],
            temperature: 0.7,
            max_tokens: 300
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Groq API Fehler. Überprüfe deinen API-Key.');
        }

        const groqGeneratedPrompt = data.choices[0]?.message?.content.trim();
        statusText.innerText = "Schritt 2/2: Groq-Analyse abgeschlossen. Rendere Fotorealistisches Bild...";

        // Kombiniere Groq-Prompt mit Zusatz-Prompt & Quality-Tags
        const finalPrompt = encodeURIComponent(`${groqGeneratedPrompt}, ${extraPrompt}, hyperrealistic photograph, shot on 35mm lens, realistic skin texture, volumetric lighting, masterpiece, highly detailed, 8k resolution`);

        // FLUX Rendering Engine
        const seed = Math.floor(Math.random() * 1000000);
        const imageUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1024&height=1280&seed=${seed}&model=flux&nologo=true`;

        // Bild laden
        outputImg.onload = function() {
          loader.style.display = 'none';
          outputImg.style.display = 'block';
          downloadBtn.href = imageUrl;
          downloadBtn.style.display = 'inline-block';
          statusText.innerText = "Erfolgreich generiert!";
          generateBtn.disabled = false;
        };

        outputImg.onerror = function() {
          throw new Error("Fehler beim Laden des gerenderten Bildes.");
        };

        outputImg.src = imageUrl;

      } catch (err) {
        alert('Fehler: ' + err.message);
        loader.style.display = 'none';
        placeholderText.style.display = 'block';
        statusText.innerText = "";
        generateBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
